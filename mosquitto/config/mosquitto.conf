# Manufaction MQTT broker (Mosquitto 2.x)
# Internal only: port 1883 is NOT published to the host/internet in docker-compose.yml.
# Edge devices outside the server should connect over TLS (8883) — see README "Next steps".

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

listener 1883
allow_anonymous false
password_file /mosquitto/data/passwd
acl_file /mosquitto/data/acl

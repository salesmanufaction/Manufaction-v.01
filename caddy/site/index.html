<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Manufaction · Plant View</title>
<style>
  :root {
    --bg: #f4f6f9; --panel: #ffffff; --ink: #14202e; --muted: #5d6b7c; --line: #e2e7ee;
    --brand: #1b2a3d; --accent: #e8792b;
    --run: #1f9d55; --idle: #c99a06; --fault: #d64545; --off: #8a96a5; --maint: #6b5bd2;
    --track: #e7ebf1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1620; --panel: #172230; --ink: #e8eef5; --muted: #93a2b5; --line: #253447;
      --brand: #0b111a; --track: #253447;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { background: var(--brand); color: #fff; padding: 14px 24px; display: flex;
           align-items: center; gap: 16px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 18px; letter-spacing: .12em; font-weight: 700; }
  header .site { color: #b9c6d6; }
  header .right { margin-left: auto; display: flex; gap: 14px; align-items: center; color: #b9c6d6; font-size: 13px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; background: var(--off); }
  .dot.ok { background: var(--run); } .dot.bad { background: var(--fault); }
  main { padding: 20px 24px 40px; max-width: 1400px; margin: 0 auto; }
  .banner { display: none; background: var(--fault); color: #fff; padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; }
  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 18px; }
  .kpi, .panel, .asset { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  .kpi { padding: 14px 16px; }
  .kpi .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  .kpi .value { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .kpi .sub { color: var(--muted); font-size: 12px; }
  .grid { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 18px; align-items: start; }
  .assets { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .asset { padding: 14px 16px; }
  .asset .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .asset h3 { margin: 0; font-size: 15px; }
  .asset .meta { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
  .pill { font-size: 11px; font-weight: 700; letter-spacing: .06em; padding: 3px 8px; border-radius: 999px; color: #fff; text-transform: uppercase; }
  .s-running { background: var(--run); } .s-idle { background: var(--idle); }
  .s-faulted, .s-stopped { background: var(--fault); } .s-maintenance { background: var(--maint); }
  .s-offline { background: var(--off); }
  .signals { display: grid; grid-template-columns: 1fr; gap: 5px; margin: 8px 0 12px; }
  .signals div { display: flex; justify-content: space-between; gap: 6px; border-bottom: 1px dashed var(--line); padding-bottom: 3px; }
  .signals span:first-child { color: var(--muted); font-size: 12px; }
  .signals span:last-child { font-variant-numeric: tabular-nums; font-weight: 600; }
  .order { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; }
  .bar { height: 8px; background: var(--track); border-radius: 99px; overflow: hidden; margin-top: 5px; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .6s ease; }
  .alert { margin-top: 10px; font-size: 12px; color: var(--fault); font-weight: 600; }
  .panel { padding: 14px 16px; margin-bottom: 14px; }
  .panel h2 { margin: 0 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td, th { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .panel { overflow-x: auto; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .empty { color: var(--muted); font-size: 13px; }
  .section-title { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 10px; }
  @media (max-width: 980px) { .grid { grid-template-columns: 1fr; } .kpis { grid-template-columns: repeat(2, minmax(0,1fr)); } }
  @media (max-width: 520px) { main { padding: 16px; } header { padding: 12px 16px; } .kpi .value { font-size: 24px; } }
</style>
</head>
<body>
<header>
  <h1>MANUFACTION</h1>
  <span class="site" id="site">Plant View</span>
  <div class="right"><span class="dot" id="conn"></span><span id="updated">connecting…</span></div>
</header>
<main>
  <div class="banner" id="banner"></div>
  <section class="kpis">
    <div class="kpi"><div class="label">Machines running</div><div class="value" id="k-run">–</div><div class="sub" id="k-run-sub">&nbsp;</div></div>
    <div class="kpi"><div class="label">First-pass yield today</div><div class="value" id="k-fpy">–</div><div class="sub" id="k-fpy-sub">&nbsp;</div></div>
    <div class="kpi"><div class="label">Downtime today</div><div class="value" id="k-dt">–</div><div class="sub" id="k-dt-sub">&nbsp;</div></div>
    <div class="kpi"><div class="label">Receipts sent to ERP</div><div class="value" id="k-erp">–</div><div class="sub">latest 5 shown</div></div>
  </section>
  <div class="grid">
    <section>
      <p class="section-title">Assets</p>
      <div class="assets" id="assets"></div>
    </section>
    <aside>
      <div class="panel"><h2>Production orders</h2><div id="orders"></div></div>
      <div class="panel"><h2>Downtime today</h2><div id="downtime"></div></div>
      <div class="panel"><h2>ERP receipts</h2><div id="receipts"></div></div>
      <div class="panel"><h2>Recent events</h2><div id="events"></div></div>
    </aside>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const time = t => t ? new Date(t).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit', second: '2-digit'}) : '';
const label = k => k.replace(/_/g, ' ').replace(/\bpct\b/, '%');
const fmt = v => typeof v === 'number' ? v.toLocaleString(undefined, {maximumFractionDigits: 1}) : esc(v);

function table(rows, cols) {
  if (!rows.length) return '<p class="empty">Nothing yet.</p>';
  return '<table><tr>' + cols.map(c => `<th class="${c.num ? 'num' : ''}">${c.h}</th>`).join('') + '</tr>' +
    rows.map(r => '<tr>' + cols.map(c => `<td class="${c.num ? 'num' : ''}">${c.f(r)}</td>`).join('') + '</tr>').join('') + '</table>';
}

function render(d) {
  $('site').textContent = d.site.name;
  const running = d.assets.filter(a => a.status === 'running').length;
  $('k-run').textContent = `${running} / ${d.assets.length}`;
  $('k-run-sub').textContent = d.assets.filter(a => ['faulted','stopped'].includes(a.status)).length + ' faulted or stopped';
  const q = d.quality_today || {};
  $('k-fpy').textContent = q.first_pass_yield_pct == null ? '–' : q.first_pass_yield_pct + '%';
  $('k-fpy-sub').textContent = `${(q.good||0).toLocaleString()} good · ${(q.scrap||0).toLocaleString()} scrap`;
  const dtMin = d.downtime_today.reduce((s, x) => s + Number(x.minutes || 0), 0);
  $('k-dt').textContent = dtMin.toFixed(1) + ' min';
  $('k-dt-sub').textContent = d.downtime_today.reduce((s, x) => s + x.events, 0) + ' events';
  $('k-erp').textContent = d.erp_receipts.length;

  $('assets').innerHTML = d.assets.map(a => {
    const sig = Object.entries(a.signals || {}).filter(([k]) => k !== 'cycle_count').slice(0, 4)
      .map(([k, v]) => `<div><span>${esc(label(k))}</span><span>${fmt(v.value)}${v.unit && v.unit !== 'count' ? ' ' + esc(v.unit.replace('deg', '°')) : ''}</span></div>`).join('');
    const cyc = a.signals && a.signals.cycle_count ? a.signals.cycle_count.value : '–';
    const o = a.active_order;
    const order = o ? `<div class="order"><span>${esc(o.order_number)} · ${esc(o.part_number)}</span><span>${o.completed_quantity} / ${o.target_quantity}</span></div>
                       <div class="bar"><i style="width:${Math.min(100, o.percent_complete)}%"></i></div>`
                    : '<div class="order"><span>No active order</span></div>';
    const dt = a.open_downtime ? `<div class="alert">${esc(a.open_downtime.reason_code || a.open_downtime.status)} — ${esc(a.open_downtime.reason_description || '')} (since ${time(a.open_downtime.started_at)})</div>` : '';
    return `<article class="asset">
      <div class="top"><h3>${esc(a.name)}</h3><span class="pill s-${esc(a.status)}">${esc(a.status)}</span></div>
      <div class="meta">${esc(a.asset)} · ${esc(a.area || '')} · ${fmt(cyc)} cycles</div>
      <div class="signals">${sig || '<span class="empty">No signals yet</span>'}</div>
      ${order}${dt}</article>`;
  }).join('');

  $('orders').innerHTML = table(d.production, [
    {h: 'Order', f: o => esc(o.order_number)}, {h: 'Asset', f: o => esc(o.asset)},
    {h: 'Status', f: o => esc(o.status)}, {h: 'Good', num: 1, f: o => `${o.completed_quantity}/${o.target_quantity}`}]);
  $('downtime').innerHTML = table(d.downtime_today, [
    {h: 'Asset', f: x => esc(x.asset)}, {h: 'Top reason', f: x => esc(x.top_reason || '—')},
    {h: 'Events', num: 1, f: x => x.events}, {h: 'Min', num: 1, f: x => Number(x.minutes).toFixed(1)}]);
  $('receipts').innerHTML = table(d.erp_receipts, [
    {h: 'Order', f: r => esc(r.order_number)}, {h: 'Good', num: 1, f: r => r.good_quantity},
    {h: 'Scrap', num: 1, f: r => r.scrap_quantity}, {h: 'Sent', num: 1, f: r => time(r.received_at)}]);
  $('events').innerHTML = table(d.recent_events, [
    {h: 'Time', f: e => time(e.event_time)}, {h: 'Asset', f: e => esc(e.asset)},
    {h: 'Event', f: e => esc(e.event_type.replace(/_/g, ' ')) + (e.detail ? ` <span class="empty">${esc(e.detail)}</span>` : '')}]);
}

async function refresh() {
  try {
    const r = await fetch('/api/v1/dashboard', {cache: 'no-store'});
    if (!r.ok) throw new Error(`API returned ${r.status}`);
    render(await r.json());
    $('conn').className = 'dot ok';
    $('updated').textContent = 'updated ' + new Date().toLocaleTimeString();
    $('banner').style.display = 'none';
  } catch (e) {
    $('conn').className = 'dot bad';
    $('banner').textContent = 'Cannot reach the Manufaction API: ' + e.message;
    $('banner').style.display = 'block';
  }
}
refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>

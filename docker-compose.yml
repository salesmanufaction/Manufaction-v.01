# Manufaction v2 — two Node-RED instances: CORE (engine, owner-only) and STUDIO (customer dashboard + settings).
# Only Caddy (80/443) is reachable from the internet. Everything else stays on the private "manufaction" network.
# The CORE editor is bound to 127.0.0.1 on the host.

services:

  postgres:
    image: postgres:18
    container_name: manufaction-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: manufaction
      POSTGRES_USER: manufaction
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      STUDIO_DB_PASSWORD: ${STUDIO_DB_PASSWORD:?set STUDIO_DB_PASSWORD in .env}
      TZ: ${TZ:-America/New_York}
    volumes:
      - postgres_data:/var/lib/postgresql          # postgres 18+ layout
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manufaction -d manufaction"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [manufaction]

  mqtt:
    image: eclipse-mosquitto:2.0.22
    container_name: manufaction-mqtt
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/mosquitto/config/entrypoint.sh"]
    environment:
      MQTT_NODERED_PASSWORD: ${MQTT_NODERED_PASSWORD:?set MQTT_NODERED_PASSWORD in .env}
      MQTT_EDGE_PASSWORD: ${MQTT_EDGE_PASSWORD:?set MQTT_EDGE_PASSWORD in .env}
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - mqtt_data:/mosquitto/data
    networks: [manufaction]
    # no "ports:" on purpose — 1883 is internal only

  # CORE: the engine. MQTT ingestion, order counting, downtime/alert rules, notifications, REST API.
  # Owner-only: its editor is bound to 127.0.0.1 and has its own owner login.
  core:
    build: ./core
    image: manufaction/core:2.0.0
    container_name: manufaction-core
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/New_York}
      MF_BRAND_NAME: ${MF_BRAND_NAME:-Manufaction}
      MF_API_TOKEN: ${MF_API_TOKEN:?set MF_API_TOKEN in .env}
      DEMO_ERP_ENABLED: ${DEMO_ERP_ENABLED:-true}
      MF_NOTIFY_WEBHOOK_URL: ${MF_NOTIFY_WEBHOOK_URL:-}
      MF_NOTIFY_FORMAT: ${MF_NOTIFY_FORMAT:-json}
      MF_NOTIFY_BEARER_TOKEN: ${MF_NOTIFY_BEARER_TOKEN:-}
      CORE_ADMIN_USER: ${CORE_ADMIN_USER:-owner}
      CORE_ADMIN_HASH: ${CORE_ADMIN_HASH:?set CORE_ADMIN_HASH in .env}
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: manufaction
      PGUSER: manufaction
      PGPASSWORD: ${POSTGRES_PASSWORD}
      MQTT_HOST: mqtt
      MQTT_NODERED_USER: nodered
      MQTT_NODERED_PASSWORD: ${MQTT_NODERED_PASSWORD}
    volumes:
      - ./core/data:/data                          # flows.json lives in Git
      - ./brand:/brand:ro                          # logo + editor colours
    ports:
      - "127.0.0.1:1880:1880"                      # owner editor: SSH tunnel only, never public
    depends_on:
      postgres: { condition: service_healthy }
      mqtt: { condition: service_started }
    networks: [manufaction]

  # STUDIO: the customer's Node-RED. Dashboard (/dashboard) and settings pages; editor at /studio.
  # Connects to the database as the restricted user mf_studio.
  studio:
    build: ./studio
    image: manufaction/studio:2.0.0
    container_name: manufaction-studio
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/New_York}
      MF_BRAND_NAME: ${MF_BRAND_NAME:-Manufaction}
      STUDIO_ADMIN_USER: ${STUDIO_ADMIN_USER:-customer}
      STUDIO_ADMIN_HASH: ${STUDIO_ADMIN_HASH:?set STUDIO_ADMIN_HASH in .env}
      CORE_ADMIN_USER: ${CORE_ADMIN_USER:-owner}
      CORE_ADMIN_HASH: ${CORE_ADMIN_HASH}
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: manufaction
      PGUSER: mf_studio
      PGPASSWORD: ${STUDIO_DB_PASSWORD:?set STUDIO_DB_PASSWORD in .env}
    volumes:
      - ./studio/data:/data
      - ./brand:/brand:ro
    ports:
      - "127.0.0.1:1881:1880"                      # direct access for the owner (SSH tunnel)
    depends_on:
      postgres: { condition: service_healthy }
    networks: [manufaction]

  caddy:
    image: caddy:2.10.2
    container_name: manufaction-caddy
    restart: unless-stopped
    environment:
      MF_SITE_ADDRESS: ${MF_SITE_ADDRESS:-localhost}
      MF_ACME_EMAIL: ${MF_ACME_EMAIL:-admin@example.com}
      MF_BASIC_USER: ${MF_BASIC_USER:-admin}
      MF_BASIC_HASH: ${MF_BASIC_HASH:?set MF_BASIC_HASH in .env}
      MF_API_TOKEN: ${MF_API_TOKEN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./brand:/srv/brand:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [core, studio]
    networks: [manufaction]

  # Plays the role of a Manufaction Edge device until real hardware exists.
  # Stop it with: docker compose stop simulator
  simulator:
    build: ./simulator
    image: manufaction/simulator:0.1.0
    container_name: manufaction-simulator
    restart: unless-stopped
    environment:
      MQTT_HOST: mqtt
      MQTT_EDGE_USER: edge
      MQTT_EDGE_PASSWORD: ${MQTT_EDGE_PASSWORD}
      SIM_SITE: demo
      SIM_SPEED: ${SIM_SPEED:-1.0}
      SIM_FAULT_RATE: ${SIM_FAULT_RATE:-0.02}
      SIM_SCRAP_RATE: ${SIM_SCRAP_RATE:-0.03}
      SIM_DEMO_MODE: ${SIM_DEMO_MODE:-false}
      SIM_DEMO_FAULT_EVERY: ${SIM_DEMO_FAULT_EVERY:-75}
      SIM_DEMO_FAULT_SECONDS: ${SIM_DEMO_FAULT_SECONDS:-30}
    depends_on: [mqtt, core]
    networks: [manufaction]

volumes:
  postgres_data:
  mqtt_data:
  caddy_data:
  caddy_config:

networks:
  manufaction:
    driver: bridge
